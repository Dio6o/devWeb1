<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4">Cadastro de Funcionário</h2>

    <form>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Nome">
            </div>

            <div class="col-md-3">
                <input type="date" class="form-control">
            </div>

            <div class="col-md-3">
                <select class="form-select">
                    <option>Sexo</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="CPF">
            </div>

            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="RG">
            </div>

            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Título Eleitoral">
            </div>
        </div>

        <h5>Endereço</h5>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Rua">
            </div>

            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="Número">
            </div>

            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Bairro">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Cidade">
            </div>

            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="Estado">
            </div>

            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="CEP">
            </div>
        </div>

        <h5>Contato</h5>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Telefone Residencial">
            </div>

            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Celular">
            </div>

            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Instagram">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Facebook">
            </div>

            <div class="col-md-2">
                <input type="number" class="form-control" placeholder="Filhos">
            </div>

            <div class="col-md-3">
                <input type="number" class="form-control" placeholder="Salário">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>

    </form>
</div>

</body>
</html>
