<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário Funcionário</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container mt-4">
    <h2 class="mb-4">Formulário Funcionário</h2>

    <form id="formFuncionario">

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Nome" id="nome">
            </div>
            <div class="col-md-3">
                <input type="date" class="form-control" id="dataNascimento">
            </div>
            <div class="col-md-3">
                <select class="form-select" id="sexo">
                    <option>Sexo</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                </select>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="CPF" id="cpf">
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="RG" id="rg">
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Título Eleitoral" id="titulo">
            </div>
        </div>

        <h5>Endereço</h5>

        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" class="form-control" placeholder="Rua" id="rua">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="Número" id="numero">
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Bairro" id="bairro">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Cidade" id="cidade">
            </div>
            <div class="col-md-2">
                <input type="text" class="form-control" placeholder="Estado" id="estado">
            </div>
            <div class="col-md-3">
                <input type="text" class="form-control" placeholder="CEP" id="cep">
            </div>
        </div>

        <h5>Contato</h5>

        <div class="row mb-3">
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Telefone Residencial" id="telefone">
            </div>
            <div class="col-md-4">
                <input type="text" class="form-control" placeholder="Celular" id="celular">
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-md-2">
                <input type="number" class="form-control" placeholder="Filhos" id="filhos">
            </div>
            <div class="col-md-3">
                <input type="number" class="form-control" placeholder="Salário" id="salario">
            </div>
        </div>

        <button type="submit" class="btn btn-primary">Cadastrar</button>

    </form>

    <div id="tabelaContainer" class="mt-5"></div>

</div>

<script src="script.js"></script>
</body>
</html>
